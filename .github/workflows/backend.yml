name: Backend validation

on:
  push:
    branches: [EM-XW-002-T02, EM-XW-004-T03]
  pull_request:
    paths:
      - 'backend/**'
      - 'support/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-validation-only-not-a-production-key
      CRM_BASE_URL: http://localhost:4002
      DJANGO_DEBUG: 'False'
      GET_CRM_DATA_CALLABLE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the pinned Python dependencies
        run: python -m pip install -r backend/solution/requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate Django configuration
        working-directory: backend/solution
        run: python manage.py check
      - name: Check for missing migrations
        working-directory: backend/solution
        run: python manage.py makemigrations --check --dry-run
      - name: Run calculation, service, and endpoint tests
        working-directory: backend/solution
        run: python manage.py test --verbosity 2
      - name: Run supplied mock regression tests
        run: node --test support/*.test.mjs
