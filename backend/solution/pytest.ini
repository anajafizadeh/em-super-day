[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts = -m "not fx_live"
markers =
    integration: runs against the real mock CRM (node backend/mock-crm.mjs); skipped if it is not running
    fx_live: calls the real ExchangeRate-API (uses quota); run explicitly with pytest -m fx_live
